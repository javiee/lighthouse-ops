# Reconciles the encrypted Secrets (SOPS + age) from ./gitops/secrets.
#
# Decryption happens inside kustomize-controller using the `sops-age` secret
# in flux-system (the age PRIVATE key, created out-of-band with kubectl —
# never committed to git). Only this Kustomization has `decryption` set.
#
# App Kustomizations (hermes-agent, pharos-sre-bot, obsidian-sync) declare
# `dependsOn: [secrets]` so a fresh cluster restore gets the secrets before
# the workloads that consume them.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./gitops/secrets
  prune: true
  wait: true
  timeout: 5m0s
  decryption:
    provider: sops
    secretRef:
      name: sops-age
