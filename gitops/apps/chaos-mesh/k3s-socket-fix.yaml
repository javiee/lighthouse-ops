---
# k3s runs its containerd socket at /var/run/k3s/containerd/containerd.sock,
# but the chaos-mesh chart maps chaosDaemon.socketPath to /host-run/<basename>
# (flat), so the daemon can never reach the nested k3s path.
#
# This tiny DaemonSet creates a flat symlink /var/run/containerd.sock ->
# k3s/containerd/containerd.sock on every node (both here are k3s). It loops
# because /var/run is tmpfs and the symlink vanishes on node reboot / NixOS
# activation; the HelmRelease sets chaosDaemon.socketPath accordingly.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: k3s-socket-fix
  namespace: chaos-mesh
  labels:
    app.kubernetes.io/name: k3s-socket-fix
    app.kubernetes.io/instance: chaos-mesh
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: k3s-socket-fix
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k3s-socket-fix
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists # k3s control-plane nodes carry taints
      containers:
        - name: fix
          image: busybox:stable
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              while true; do
                if [ -S /host-run/k3s/containerd/containerd.sock ] && [ ! -e /host-run/containerd.sock ]; then
                  ln -sf k3s/containerd/containerd.sock /host-run/containerd.sock
                fi
                sleep 60
              done
          volumeMounts:
            - name: run
              mountPath: /host-run
      volumes:
        - name: run
          hostPath:
            path: /var/run
            type: Directory
