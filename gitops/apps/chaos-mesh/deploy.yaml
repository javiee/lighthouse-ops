---
apiVersion: v1
kind: Namespace
metadata:
  name: chaos-mesh
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: chaos-mesh
  namespace: flux-system
spec:
  interval: 1h0m
  url: https://charts.chaos-mesh.org
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chaos-mesh
  namespace: chaos-mesh
spec:
  interval: 1h0m
  chart:
    spec:
      chart: chaos-mesh
      version: "2.8.6"
      sourceRef:
        kind: HelmRepository
        name: chaos-mesh
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Web UI to run chaos experiments on demand. Chart 2.8.6 exposes it as
    # NodePort 2333 with NO auth — it stays LAN-only by design (do not
    # front it with ngrok).
    chaosDashboard:
      enabled: true
    # The chart defaults to the DOCKER runtime; these nodes are k3s
    # (containerd). The socket is nested under /var/run/k3s/containerd/,
    # which the chart's flat /host-run/<basename> mapping cannot reach —
    # k3s-socket-fix.yaml symlinks it to /var/run/containerd.sock.
    chaosDaemon:
      runtime: containerd
      socketPath: /var/run/containerd.sock
      # Prepend /host-run/chaos-shim (host /var/run/chaos-shim, created by
      # chaos-daemon-node-fix.yaml): shims that exec the nftables flavor of
      # iptables, because the image hardcodes the legacy flavor (broken on
      # nftables-backend kernels; chaos-mesh PR #4959, unfixed in 2.8.6).
      env:
        PATH: /host-run/chaos-shim:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/byteman/bin:/usr/local/bin
