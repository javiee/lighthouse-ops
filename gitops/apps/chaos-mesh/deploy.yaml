---
apiVersion: v1
kind: Namespace
metadata:
  name: chaos-mesh
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: chaos-mesh
  namespace: flux-system
spec:
  interval: 1h0m
  url: https://charts.chaos-mesh.org
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chaos-mesh
  namespace: chaos-mesh
spec:
  interval: 1h0m
  chart:
    spec:
      chart: chaos-mesh
      version: "2.8.6"
      sourceRef:
        kind: HelmRepository
        name: chaos-mesh
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Web UI to run chaos experiments on demand. ClusterIP only (no ingress by
    # cluster design): access via `kubectl -n chaos-mesh port-forward svc/chaos-dashboard`.
    chaosDashboard:
      enabled: true
