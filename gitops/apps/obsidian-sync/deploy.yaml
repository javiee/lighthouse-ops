---
apiVersion: v1
kind: Namespace
metadata:
  name: obsidian-sync
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: couchdb-data
  namespace: obsidian-sync
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: couchdb
  namespace: obsidian-sync
  labels:
    app: couchdb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: couchdb
  template:
    metadata:
      labels:
        app: couchdb
    spec:
      nodeSelector:
        kubernetes.io/hostname: lh-satellite
      containers:
        - name: couchdb
          # Semi-official Apache image (apache/couchdb-docker). Runs as root
          # (no USER directive), so the root-owned local-path volume works
          # without a securityContext override.
          image: couchdb:3.5.3
          imagePullPolicy: IfNotPresent
          env:
            # Secret is created out-of-band (never committed to this repo):
            #   kubectl -n obsidian-sync create secret generic couchdb-admin \
            #     --from-literal=COUCHDB_USER=admin \
            #     --from-literal=COUCHDB_PASSWORD=<generated>
            - name: COUCHDB_USER
              valueFrom:
                secretKeyRef:
                  name: couchdb-admin
                  key: COUCHDB_USER
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: couchdb-admin
                  key: COUCHDB_PASSWORD
          ports:
            - name: http
              containerPort: 5984
          livenessProbe:
            httpGet:
              path: /_up
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /_up
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /opt/couchdb/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: couchdb-data
---
apiVersion: v1
kind: Service
metadata:
  name: couchdb
  namespace: obsidian-sync
  labels:
    app: couchdb
spec:
  type: ClusterIP
  # Pinned so tailscale serve on lh-satellite
  # (nix/modules/obsidian-tailscale.nix) has a stable backend address.
  # Chosen from k3s' service CIDR (10.43.0.0/16), verified free 2026-10-29.
  # Also exposed on the LAN by the host-less Ingress below (plain HTTP, for the Mac,
  # which is on another tailnet); the Tailscale HTTPS path is unchanged.
  clusterIP: 10.43.20.9
  selector:
    app: couchdb
  ports:
    - name: http
      port: 5984
      targetPort: http
---
# LAN access for devices not on the home tailnet: http://192.168.10.200
# No host rule, so it works by IP (.lighthouse.local names stall on macOS'
# mDNS lookup) and catches only requests no Host-based router claims; the
# other *.lighthouse.local sites win on rule priority. Plain HTTP, so the
# CouchDB admin password crosses the LAN unencrypted on every request; notes
# themselves are LiveSync E2EE. Accepted trade-off, home LAN only.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: couchdb
  namespace: obsidian-sync
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: couchdb
                port:
                  name: http
