---
apiVersion: v1
kind: Namespace
metadata:
  name: hermes-agent
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: hermes-agent
  namespace: flux-system
spec:
  interval: 1m
  chart: ./charts/hermes-agent
  # Repackage on every Git change. The default (ChartVersion) only notices a
  # Chart.yaml version bump, so template edits were silently not deployed.
  reconcileStrategy: Revision
  sourceRef:
    kind: GitRepository
    name: hermes-agent-branch
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes-agent
  namespace: hermes-agent
spec:
  interval: 1m
  chartRef:
    kind: HelmChart
    name: hermes-agent
    namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 0
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 0
  values:
    image:
      repository: ghcr.io/javiee/lighthouse-ops/hermes
      tag: v0.22.5
      pullPolicy: Always

    nodeSelector:
      kubernetes.io/hostname: lh-satellite

    # Boot-time STT patch bootstrap.
    #
    # The hermes image venv flaps between revisions (faster_whisper missing
    # or buggy — its metadata_errors kwarg is rejected by PyAV19). The
    # durable patched STT stack lives on the PVC at
    # /opt/data/home/.local/lib/python3.13/site-packages and is exposed to
    # the venv via a .pth file in the venv's site-packages. Problem: that
    # .pth lives in the CONTAINER layer, so every container restart wipes
    # it. The cron job ensure-whisper-patch.sh restores it but then
    # SIGTERMs the gateway whenever it detects a change — and under the s6
    # container topology a gateway SIGTERM kills the whole container
    # (2026-10-28 crash loop; the script's kill switch is disabled — see
    # its "AUTO-RESTART DISABLED" marker). Restoring the .pth here at boot,
    # before the gateway starts, means the cron job never sees a boot-time
    # change and the gateway is never killed for it.
    # NOTE: path hardcodes python3.13, same as the cron script's USER_SITE.
    # The patched packages include compiled 3.13 wheels, so the .pth is only
    # written when the venv is 3.13 — on any other Python it would put
    # ABI-incompatible modules on sys.path. If the image moves off 3.13,
    # rebuild that site-packages for the new version and update both paths.
    args:
      - sh
      - -c
      - |
        SITE=$(ls -d /opt/hermes/.venv/lib/python3.13/site-packages 2>/dev/null | head -1)
        if [ -n "$SITE" ]; then
          printf '/opt/data/home/.local/lib/python3.13/site-packages\n' > "$SITE/hermes_stt_user_site.pth"
        else
          echo "hermes venv is not python3.13; skipping STT .pth (patched stack is 3.13-only)" >&2
        fi
        exec hermes gateway run

    env:
       HERMES_DASHBOARD: "1"
       HERMES_DASHBOARD_HOST: "0.0.0.0"
       HERMES_DASHBOARD_INSECURE: "1"
       API_SERVER_ENABLED: "true"
       API_SERVER_HOST: "0.0.0.0"
       API_SERVER_KEY: "change-me-in-production"
       WEBHOOK_ENABLED: "true"
       WEBHOOK_PORT: "8644"
       TERMINAL_ENV: "local"
       # HASS serves a Let's Encrypt cert (SAN: home-pinos.duckdns.org). hermes' HASS
       # client (aiohttp) has no skip-verify option, so connecting by IP fails TLS
       # hostname verification. Use the cert hostname; hostAliases below pins it to the
       # internal LAN IP so traffic stays local (no NAT hairpin) and TLS still verifies.
       HASS_URL: "https://home-pinos.duckdns.org:8123"
       # Obsidian skill (filesystem-only). The folder is kept in sync with the
       # LiveSync CouchDB vault by the livesync-bridge sidecar below.
       OBSIDIAN_VAULT_PATH: "/opt/data/obsidian-vault"

    # livesync-bridge: two-way sync between the LiveSync database in CouchDB
    # (gitops/apps/obsidian-sync) and /opt/data/obsidian-vault on the shared
    # PVC. Notes hermes writes there show up on every Obsidian device, and
    # vice versa. Image built from docker/livesync-bridge/.
    #
    # Credentials and E2EE settings come from Secret `obsidian-livesync` in
    # this namespace (created out-of-band, never committed):
    #   COUCHDB_USER, COUCHDB_PASSWORD   — copy of obsidian-sync/couchdb-admin
    #   LIVESYNC_PASSPHRASE              — plugin E2EE passphrase ("" if off)
    #   LIVESYNC_OBFUSCATE_PASSPHRASE    — path obfuscation passphrase ("" if off)
    #   LIVESYNC_ID_KEY                  — plugin "Show current recovery code" (if E2EE)
    # Only this container gets them; hermes itself never sees CouchDB creds.
    #
    # The bridge idles until the plugin has initialised the `obsidian`
    # database, so the Obsidian side must be set up first with that name.
    # Runs as UID 10000 (hermes) so both containers can write the vault.
    # Bridge resume checkpoints persist in /opt/data/livesync-bridge/.
    extraContainers:
      - name: livesync-bridge
        image: ghcr.io/javiee/lighthouse-ops/livesync-bridge:0632718
        imagePullPolicy: IfNotPresent
        env:
          - name: COUCHDB_URL
            value: http://couchdb.obsidian-sync.svc.cluster.local:5984
          - name: LIVESYNC_DATABASE
            value: obsidian
          - name: LIVESYNC_VAULT_DIR
            value: /opt/data/obsidian-vault
          - name: LSB_STATE_DIR
            value: /opt/data/livesync-bridge/location_data
        envFrom:
          - secretRef:
              name: obsidian-livesync
              optional: true
        securityContext:
          runAsUser: 10000
          runAsGroup: 10000
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        # Whole PVC, not subPaths: kubelet creates missing subPath dirs as
        # root, which UID 10000 could not write.
        volumeMounts:
          - name: data
            mountPath: /opt/data

    hostAliases:
      - ip: "192.168.10.65"
        hostnames:
          - home-pinos.duckdns.org

    secretEnv:
      GITHUB_TOKEN:
        secretKeyRef:
          name: hermes-github-token
          key: github-token
      HASS_TOKEN:
        secretKeyRef:
          name: hermes-hass-token
          key: hass-token

    telegram:
       allowed_users: "612246271"
       home_channel: "612246271"

    ingress:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: web
      hosts:
        - host: hermes.lighthouse.local
          paths:
            - path: /
              pathType: Prefix
              port: dashboard

    # Model config lives in /opt/data/config.yaml inside the pod (on the PVC),
    # managed by hand — not via this manifest. Current setup (as of 2026-10-27):
    #   model:
    #     default: Qwen3.8-27B-UD-Q4_K_XL
    #     provider: custom:leviathan:13305   # references the custom_providers entry below
    #   custom_providers:
    #   - name: leviathan:13305
    #     base_url: http://192.168.10.213:13305/api/v1   # lemond (Lemonade) on leviathan, wired enp10s0
    #     model: Qwen3.8-27B-UD-Q4_K_XL
    #
    # IMPORTANT: use the NAMED custom-provider form (provider: custom:<name>).
    # The bare form (provider: custom + model.base_url) does NOT survive
    # hermes re-saving its config: the serializer wipes model.base_url when a
    # matching custom_providers entry exists, and bare-custom resolution with
    # an empty base_url falls back to OpenRouter (silent total failure).
    # The named form round-trips hermes's own save_config unchanged.
    #
    # NOTE: lemond and llama-swap are mutually exclusive on the R9700's VRAM
    # (see nix/modules/lemonade.nix). hermes only works while `lemond` is
    # running on leviathan (`sudo systemctl start lemond`); switching back to
    # llama-swap:9090 requires updating the custom_providers entry.
    # 192.168.10.213 is leviathan's wired IP (enp10s0) — preferred over the
    # Wi-Fi IP (wlp9s0, e.g. 192.168.10.127) for stability. If the wired
    # address ever changes, update the custom_providers entry.
    #
    # To edit:
    #   ssh lh-satellite
    #   kubectl -n hermes-agent cp <pod>:/opt/data/config.yaml /tmp/c.yaml
    #   # edit /tmp/c.yaml
    #   kubectl -n hermes-agent cp /tmp/c.yaml <pod>:/opt/data/config.yaml
    #   kubectl -n hermes-agent rollout restart deployment hermes-agent
