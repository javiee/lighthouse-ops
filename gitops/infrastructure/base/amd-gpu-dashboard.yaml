---
# Grafana dashboard for leviathan's R9700, loaded by the Grafana sidecar
# (grafana_dashboard label, searchNamespace: ALL). Generated JSON; hwmon
# chip 0000:02:00_0_0000:03:00_0 is the dGPU (PCI 03:00.0). DRM panels pick
# the dGPU by VRAM size (>16 GB) since cardN numbering is not stable.
# Needs --collector.drm (kube-prometheus-stack.yaml) for busy/VRAM panels.
apiVersion: v1
kind: ConfigMap
metadata:
  name: amd-gpu-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  amd-r9700.json: |
    {
      "uid": "amd-r9700",
      "title": "AMD R9700 (leviathan)",
      "tags": [
        "gpu",
        "amd",
        "leviathan"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "ds",
            "label": "Datasource",
            "type": "datasource",
            "query": "prometheus"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "GPU busy",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "max(node_drm_gpu_busy_percent and on (instance, card) node_drm_memory_vram_size_bytes > 16e9)",
              "legendFormat": "",
              "refId": "A",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 70
                  },
                  {
                    "color": "orange",
                    "value": 95
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "VRAM used",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "max(node_drm_memory_vram_used_bytes and on (instance, card) node_drm_memory_vram_size_bytes > 16e9) / max(node_drm_memory_vram_size_bytes > 16e9) * 100",
              "legendFormat": "",
              "refId": "A",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 97
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Board power",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "node_hwmon_power_average_watt{chip=\"0000:02:00_0_0000:03:00_0\"}",
              "legendFormat": "",
              "refId": "A",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 200
                  },
                  {
                    "color": "orange",
                    "value": 280
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Junction temp",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "node_hwmon_temp_celsius{chip=\"0000:02:00_0_0000:03:00_0\", sensor=\"temp2\"}",
              "legendFormat": "",
              "refId": "A",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 90
                  },
                  {
                    "color": "orange",
                    "value": 100
                  },
                  {
                    "color": "red",
                    "value": 105
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "GPU energy, last 24h",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "avg_over_time(node_hwmon_power_average_watt{chip=\"0000:02:00_0_0000:03:00_0\"}[24h]) * 24 / 1000",
              "legendFormat": "",
              "refId": "A",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "kwatth",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "decimals": 2
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Fan",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "node_hwmon_fan_rpm{chip=\"0000:02:00_0_0000:03:00_0\"}",
              "legendFormat": "",
              "refId": "A",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "rotrpm",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 3500
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "GPU busy",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "max(node_drm_gpu_busy_percent and on (instance, card) node_drm_memory_vram_size_bytes > 16e9)",
              "legendFormat": "busy",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1
              },
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "VRAM",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "max(node_drm_memory_vram_used_bytes and on (instance, card) node_drm_memory_vram_size_bytes > 16e9)",
              "legendFormat": "used",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "max(node_drm_memory_vram_size_bytes > 16e9)",
              "legendFormat": "total",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Board power",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "node_hwmon_power_average_watt{chip=\"0000:02:00_0_0000:03:00_0\"}",
              "legendFormat": "average",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "node_hwmon_power_cap_watt{chip=\"0000:02:00_0_0000:03:00_0\"}",
              "legendFormat": "cap",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Temperatures",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "node_hwmon_temp_celsius{chip=\"0000:02:00_0_0000:03:00_0\"} * on (instance, chip, sensor) group_left (label) node_hwmon_sensor_label{chip=\"0000:02:00_0_0000:03:00_0\"}",
              "legendFormat": "{{label}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Clocks",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 20
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "node_hwmon_freq_freq_mhz{chip=\"0000:02:00_0_0000:03:00_0\"}",
              "legendFormat": "{{sensor}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "rotmhz",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Fan",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 20
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "node_hwmon_fan_rpm{chip=\"0000:02:00_0_0000:03:00_0\"}",
              "legendFormat": "fan",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "rotrpm",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "GPU energy per day",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 28
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "avg_over_time(node_hwmon_power_average_watt{chip=\"0000:02:00_0_0000:03:00_0\"}[1d]) * 24 / 1000",
              "legendFormat": "kWh",
              "refId": "A",
              "interval": "1d"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "kwatth",
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 80,
                "lineWidth": 1
              },
              "min": 0,
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        }
      ]
    }
