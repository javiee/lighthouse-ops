name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'docker/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: javiee/lighthouse-ops
  HERMES_VERSION: v0.22.5
  # Short SHA of the vrtmrz/livesync-bridge commit pinned in its Dockerfile.
  LIVESYNC_BRIDGE_VERSION: "0632718"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed Dockerfiles
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            hermes:
              - 'docker/hermes/**'
            livesync-bridge:
              - 'docker/livesync-bridge/**'

      - name: Set up Docker Buildx
        if: steps.filter.outputs.hermes == 'true' || steps.filter.outputs.livesync-bridge == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          docker buildx create --name builder --use
          docker buildx inspect --bootstrap > /dev/null
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push hermes
        if: steps.filter.outputs.hermes == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/hermes"
          TAG="${{ env.HERMES_VERSION }}"
          echo "Building hermes -> $IMAGE:$TAG"
          docker buildx build \
            -f docker/hermes/Dockerfile \
            --push \
            -t "$IMAGE:$TAG" \
            -t "$IMAGE:latest" \
            --cache-from=type=gha,scope=hermes \
            --cache-to=type=gha,mode=max,scope=hermes \
            .

      - name: Build and push livesync-bridge
        if: steps.filter.outputs.livesync-bridge == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/livesync-bridge"
          TAG="${{ env.LIVESYNC_BRIDGE_VERSION }}"
          echo "Building livesync-bridge -> $IMAGE:$TAG"
          docker buildx build \
            -f docker/livesync-bridge/Dockerfile \
            --push \
            -t "$IMAGE:$TAG" \
            -t "$IMAGE:latest" \
            --cache-from=type=gha,scope=livesync-bridge \
            --cache-to=type=gha,mode=max,scope=livesync-bridge \
            docker/livesync-bridge
